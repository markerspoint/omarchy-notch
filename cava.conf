# Dedicated raw output for the notch; independent of terminal Cava settings.
[general]
framerate = 30
bars = 32
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
integral = 77
gravity = 100
ignore = 0
