name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test installer, recorder state, and release archive
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile install.py watch-recording.py scripts/package.py

  syntax:
    name: QML, shell, and Lua
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install syntax-checking tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools shellcheck lua5.4
      - name: Parse QML
        run: |
          for file in *.qml; do
            /usr/lib/qt6/bin/qmlformat -n "$file" > /dev/null
          done
      - name: Check shell scripts
        run: |
          bash -n watch-navbar.sh
          bash -n watch-notifications.sh
          shellcheck watch-navbar.sh watch-notifications.sh
      - name: Parse Hyprland Lua
        run: luac5.4 -p hypr/notch.lua
      - name: Check whitespace
        run: git show --format= --check HEAD

  package:
    name: Build installable archive
    needs: [tests, syntax]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Package plugin
        run: python scripts/package.py
      - name: Upload archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omarchy-notch
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
